<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>公園オセロ</title><link rel="stylesheet" href="style.css"></head>
<link rel="stylesheet" href="victory.css"><link rel="stylesheet" href="opponent.css"><link rel="stylesheet" href="beginner.css"><link rel="stylesheet" href="guide.css"><link rel="stylesheet" href="imagegen-world.css"><link rel="stylesheet" href="finish.css"><link rel="stylesheet" href="celebration.css"><link rel="stylesheet" href="strength.css"><link rel="stylesheet" href="i18n.css"><body><main>
  <header><div><small id="parkLabel">夕暮れの公園</small><h1 id="appTitle">公園オセロ</h1></div><div class="header-actions"><button id="language" aria-label="Switch language">EN</button><button id="guide">？ 遊び方</button><button id="reset">はじめから</button></div></header>
  <section class="rivals"><div id="rivalList"></div></section>
  <section class="scene">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="tree">🌳</div><div class="slide">🛝</div><div class="bench">🪑</div><div class="fountain"><span></span><span></span><span></span><b>⛲</b><i></i><i></i><i></i><i></i><i></i></div>
    <div class="speech"><b id="rivalName"></b><span id="line"></span></div><div id="seatedRival" class="seated-rival"><img id="rivalFace" class="rival-face" src="assets/seated-softcream.png" alt="座っている対戦相手"></div><div class="victory-fountain"></div><img class="victory-bird" src="assets/victory-bird.png" alt="花束を届ける鳥"><img class="popper popper-left" src="assets/party-popper.png" alt=""><img class="popper popper-right" src="assets/party-popper.png" alt="">
    <div class="score"><span>● <b id="black">2</b></span><em id="turn">あなたの番</em><span>○ <b id="white">2</b></span></div>
    <div class="board-wrap"><div id="board" class="board"></div></div><img id="hand" src="assets/placing-hand.png" alt="駒を置く手">
    <div class="grass-front"><i></i><i></i><i></i></div>
  </section>
  <footer><button id="undo">↶ ひとつ戻す</button><button id="hint">💡 ヒント</button><p>光る場所に駒を置いてね</p></footer>
  <div id="result"><div><small>対局おわり</small><h2 id="resultTitle"></h2><p id="resultScore"></p><button id="again">もう一局</button></div></div><div id="guidePanel"><div><button id="closeGuide">×</button><small>はじめてのオセロ</small><h2>3つだけ覚えよう</h2><ol><li><b>光るマス</b><span>駒を置ける場所。数字は返せる枚数です。</span></li><li><b>角はとても強い</b><span>一度取ると、最後まで返されません。</span></li><li><b>⚠には気をつけて</b><span>角を渡しやすい場所です。</span></li></ol><p>困ったら「ヒント」。間違えても戻せます。</p></div></div>
</main><script src="game.js"></script><script src="guide.js"></script><script src="i18n.js"></script><script src="live-i18n.js"></script><script src="board-fit.js"></script></body></html>
