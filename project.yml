name: KouenOthello
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.kouenothello
    DEVELOPMENT_TEAM: 83VGKGSQUH
targets:
  KouenOthello:
    type: application
    platform: iOS
    sources: [KouenOthello]
    info:
      path: KouenOthello/Info.plist
      properties:
        CFBundleDisplayName: "公園オセロ"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
